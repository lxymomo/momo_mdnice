<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理盐 · 公众号排版工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <span class="logo">🧂 心理盐排版</span>
  <div class="topbar-actions">
    <button id="btn-save-tpl">💾 保存模板</button>
    <button id="btn-load-tpl">📂 加载模板</button>
    <button id="btn-copy" class="primary">📋 复制到公众号</button>
  </div>
</header>

<main class="workspace">

  <!-- 左：编辑区 -->
  <aside class="panel-left">
    <div class="panel-title">Markdown 编辑</div>
    <textarea id="md-editor" spellcheck="false" placeholder="在这里写 Markdown..."></textarea>
  </aside>

  <!-- 中：封面生成 -->
  <aside class="panel-cover">
    <div class="panel-title">封面生成</div>
    <canvas id="cover-canvas" width="900" height="500"></canvas>
    <div class="cover-controls">
      <label>封面标题
        <input type="text" id="cover-title-input" placeholder="输入封面标题...">
      </label>
      <label>背景图 <input type="file" id="cover-bg-upload" accept="image/*"></label>
      <label>字色 <input type="color" id="cover-text-color" value="#ffffff"></label>
      <label>字号 <input type="range" id="cover-font-size" min="28" max="80" value="48"></label>
      <button id="btn-update-cover">🔄 更新封面</button>
      <button id="btn-download-cover">⬇ 下载封面</button>
    </div>
  </aside>

  <!-- 右：预览区 -->
  <section class="panel-right">
    <div class="panel-title">预览 <span style="font-size:12px;color:#999;">（此区域内容可直接复制）</span></div>
    <div id="preview-box"></div>
  </section>

</main>

<!-- 模板管理弹窗 -->
<div id="modal-tpl" class="modal hidden">
  <div class="modal-inner">
    <div class="modal-title">模板管理</div>
    <div id="tpl-list"></div>
    <button id="modal-close">关闭</button>
  </div>
</div>

<!-- 复制成功提示 -->
<div id="toast" class="toast hidden">✅ 已复制，去公众号粘贴吧！</div>

<script src="assets/cover-bg-b64.js"></script>
<script src="logo.js"></script>
<script src="templates.js"></script>
<script src="parser.js"></script>
<script src="cover.js"></script>
<script src="app.js"></script>
</body>
</html>
